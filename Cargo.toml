[package]
name = "asciiquarium"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "A colorful aquarium animation for your terminal"
authors = ["Jonathan Seth Mainguy <jon@soh.re>"]
license = "GPL-2.0-or-later"
repository = "https://github.com/Jmainguy/asciiquarium"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
rand = "0.10.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
